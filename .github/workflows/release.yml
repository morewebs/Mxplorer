name: Release

on:
  push:
    branches: [main]
    tags: ['v[0-9]*']

permissions:
  contents: read

# Do not cancel main builds: every successful main push gets immutable assets.
# Only feed replacement is serialized; its version guard rejects stale builds.
jobs:
  version:
    name: Select and validate release version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      channel: ${{ steps.plan.outputs.channel }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Validate source versions
        run: node scripts/check-release-version.mjs "v$(node -p 'require("./package.json").version')"
      - name: Select stable tag or unique next-patch nightly
        id: plan
        run: node scripts/release-plan.mjs

  build:
    needs: version
    uses: ./.github/workflows/ci.yml
    with:
      release-channel: ${{ needs.version.outputs.channel }}
      release-version: ${{ needs.version.outputs.version }}
      release-tag: ${{ needs.version.outputs.tag }}
    permissions:
      contents: read

  immutable:
    name: Publish immutable verified Windows release
    needs: [version, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Mxplorer-windows-x64
          path: artifacts
      - name: Publish assets without replacing existing version files
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-publish.mjs immutable artifacts

  publish:
    name: Sign and advance completed channel feed
    needs: [version, immutable]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Both channels share one metadata branch; serialize initialization and atomic commits.
    # Queue all pending pointer jobs; the version guard also handles out-of-order builds.
    concurrency:
      group: mxplorer-signed-update-feed
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Mxplorer-windows-x64
          path: artifacts
      - name: Sign verified feed and publish channel pointer last
        env:
          GH_TOKEN: ${{ github.token }}
          MXPLORER_UPDATE_SIGNING_KEY: ${{ secrets.MXPLORER_UPDATE_SIGNING_KEY }}
        run: node scripts/release-publish.mjs pointer artifacts
      - name: Stage both authenticated canonical channel feeds for Pages
        id: pages-feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-pages.mjs pages-feed
      - name: Upload signed feed Pages artifact
        id: pages-artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: pages-feed
      - name: Deploy signed feed mirror last
        id: deployment
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT_ID: ${{ steps.pages-artifact.outputs.artifact_id }}
          PAGES_METADATA_REVISION: ${{ steps.pages-feed.outputs.revision }}
        run: node scripts/release-deploy-pages.mjs
