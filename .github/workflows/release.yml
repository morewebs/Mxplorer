name: Release

on:
  push:
    tags: ['v[0-9]*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Validate release version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Verify tag and package versions agree
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/check-release-version.mjs "$RELEASE_TAG"

  build:
    needs: version
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    name: Publish verified Windows builds
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Mxplorer-windows-x64
          path: artifacts
      - name: Verify downloaded checksums
        working-directory: artifacts
        run: sha256sum --check SHA256SUMS.txt
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" artifacts/* --clobber
          else
            options=(--verify-tag --title "Mxplorer $RELEASE_TAG" --generate-notes --notes "Windows x64 builds are unsigned.")
            if [[ "$RELEASE_TAG" == *-* ]]; then
              options+=(--prerelease --latest=false)
            fi
            gh release create "$RELEASE_TAG" artifacts/* "${options[@]}"
          fi
