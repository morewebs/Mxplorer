name: CI

on:
  push:
    # Main is built once by release.yml through workflow_call, including adoption.
    branches: ['codex/**']
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      release-channel:
        type: string
        default: ''
      release-version:
        type: string
        default: ''
      release-tag:
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ inputs.release-channel != '' && format('{0}-{1}', github.run_id, github.run_attempt) || 'check' }}
  cancel-in-progress: ${{ inputs.release-channel == '' && github.ref_type != 'tag' }}

env:
  CI: true
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: Frontend tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node --test scripts/release-*.test.mjs
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --workers=2
      - name: Upload browser failure traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  windows:
    name: Windows tests and installer
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      MXPLORER_CHANNEL: ${{ inputs.release-channel || 'stable' }}
      MXPLORER_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Set actual nightly build version
        if: inputs.release-channel == 'nightly'
        env:
          BUILD_VERSION: ${{ inputs.release-version }}
        run: node scripts/set-build-version.mjs "$env:BUILD_VERSION"
      - run: npm ci
      - run: node --test scripts/release-*.test.mjs
      - run: npm run build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Ensure WebView2 runtime
        shell: pwsh
        run: |
          $runtime = Get-ChildItem 'C:\Program Files (x86)\Microsoft\EdgeWebView\Application' -Filter msedgewebview2.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $runtime) {
            $bootstrapper = Join-Path $env:RUNNER_TEMP 'MicrosoftEdgeWebview2Setup.exe'
            Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $bootstrapper
            $process = Start-Process -FilePath $bootstrapper -ArgumentList '/silent', '/install' -Wait -PassThru -WindowStyle Hidden
            if ($process.ExitCode -ne 0) { throw "WebView2 installation failed: $($process.ExitCode)" }
          }
      - name: Test native cookie restoration when available
        timeout-minutes: 4
        run: npm run test:native-cookies --if-present
      - name: Build Windows executable and NSIS installer
        run: npm run bundle -- --ci -- --locked
      - name: Verify actual browser startup before packaging
        timeout-minutes: 1
        shell: pwsh
        run: ./scripts/test-browser-startup.ps1 -Binary 'src-tauri/target/release/mxplorer.exe' -ArtifactDirectory "$env:RUNNER_TEMP/browser-startup"
      - name: Prepare downloadable builds and checksums
        if: inputs.release-channel == ''
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          Copy-Item -LiteralPath 'src-tauri/target/release/mxplorer.exe' -Destination 'artifacts/Mxplorer.exe'
          $installers = @(Get-ChildItem -LiteralPath 'src-tauri/target/release/bundle/nsis' -Filter '*-setup.exe')
          if ($installers.Count -eq 0) { throw 'No NSIS installer was produced' }
          $installers | Copy-Item -Destination artifacts
          $checksums = Get-ChildItem -LiteralPath artifacts -File | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash *$($_.Name)"
          }
          $checksums | Set-Content -LiteralPath artifacts/SHA256SUMS.txt -Encoding utf8NoBOM
      - uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5.3.0
        if: inputs.release-channel != ''
        with:
          dotnet-version: '8.0.428'
      - name: Install matching Velopack CLI
        if: inputs.release-channel != ''
        run: dotnet tool install vpk --version 1.2.161 --tool-path "$env:RUNNER_TEMP/vpk"
      - name: Restore authenticated previous full package and pack managed release
        if: inputs.release-channel != ''
        env:
          RELEASE_CHANNEL: ${{ inputs.release-channel }}
          RELEASE_VERSION: ${{ inputs.release-version }}
          RELEASE_TAG: ${{ inputs.release-tag }}
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path pack-input -Force | Out-Null
          Copy-Item -LiteralPath 'src-tauri/target/release/mxplorer.exe' -Destination 'pack-input/mxplorer.exe'
          node scripts/release-feed.mjs restore "$env:RELEASE_CHANNEL" "$env:RELEASE_VERSION" managed-output baseline.json
          if ($LASTEXITCODE -ne 0) { throw 'Authenticated baseline restoration failed' }
          & "$env:RUNNER_TEMP/vpk/vpk.exe" pack --packId Mxplorer --packVersion "$env:RELEASE_VERSION" --packDir pack-input --mainExe mxplorer.exe --packTitle Mxplorer --packAuthors Moreweb --channel "$env:RELEASE_CHANNEL" --runtime win-x64 --framework webview2 --outputDir managed-output
          if ($LASTEXITCODE -ne 0) { throw 'Velopack packaging failed' }
          node scripts/release-verify-delta.mjs managed-output baseline.json "$env:RELEASE_CHANNEL" "$env:RELEASE_VERSION" "$env:RUNNER_TEMP/vpk/vpk.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Delta reconstruction failed' }
          node scripts/release-artifacts.mjs prepare managed-output artifacts "$env:RELEASE_CHANNEL" "$env:RELEASE_VERSION" "$env:RELEASE_TAG" baseline.json
          if ($LASTEXITCODE -ne 0) { throw 'Release artifact validation failed' }
      - name: Upload delta verification evidence
        if: inputs.release-channel != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Mxplorer-delta-verification
          path: managed-output/verification/delta-verification.json
          if-no-files-found: ignore
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Mxplorer-windows-x64
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
