[package]
name = "mxplorer"
version = "0.1.1"
description = "A focused native Windows browser"
authors = ["Moreweb"]
edition = "2021"

[lib]
name = "mxplorer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = ["unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39.1"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_UI_Input_KeyboardAndMouse"] }
